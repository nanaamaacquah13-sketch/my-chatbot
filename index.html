<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedLearn 💊🩺💉</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="confetti"></canvas>
  <div class="app">
    <header>
      <h1>💊🩺💉 MedLearn</h1>
      <button id="themeToggle" type="button" aria-label="Switch between light and dark mode">🌙</button>
    </header>
    <main id="chat"></main>
    <div id="starters"></div>
    <form id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Ask for a case study or answer a question…" aria-label="Your message">
      <button id="send" type="submit">Send</button>
    </form>
  </div>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
